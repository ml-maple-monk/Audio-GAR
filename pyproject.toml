[project]
name = "audio-gar"
version = "0.0.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "alias-free-torch==0.0.6",
    "numpy>=1.24,<2.4",
    "scipy",
    "scikit-learn>=1.3",
    "pandas",
    "PyYAML",
    "tqdm",
    "matplotlib",
    "soundfile",
    "librosa>=0.9,<0.12",
    "k-diffusion",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "transformers==5.16.1",
    "timm==0.9.16",
    "torchlibrosa>=0.1",
    "ftfy",
    "pillow",
    "torchvision==0.22.1",
    "diffusers==0.31.0",
    "torchvggish==0.2",
    "panns-inference==0.1.1",
    "einops",
    "pywavelets",
    "huggingface-hub",
    "pyarrow",
    "torchsde",
    "einops-exts",
    "pytorch-lightning",
    "laion-clap",
    "audiobox-aesthetics==0.0.4",
    "descript-audio-codec",
    "mlflow",
    "click==8.4.2",
    "setuptools<81",
    "audiogen-eval-protocols",
    "flash-attn==2.8.3; sys_platform == 'linux'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
audiogen-eval-protocols = { git = "https://github.com/ml-maple-monk/audiogen-eval-protocols.git", branch = "main" }
flash-attn = [
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl", marker = "python_version == '3.10' and sys_platform == 'linux'" },
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiTRUE-cp311-cp311-linux_x86_64.whl", marker = "python_version == '3.11' and sys_platform == 'linux'" },
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "python_version == '3.12' and sys_platform == 'linux'" },
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiTRUE-cp313-cp313-linux_x86_64.whl", marker = "python_version == '3.13' and sys_platform == 'linux'" },
]
